name: Fital Pro preview AI generation (14 and 30 days)

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited]

permissions:
  contents: read
  id-token: write

concurrency:
  group: fital-pro-preview-ai-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-ai-generation:
    if: >-
      github.event.pull_request.number == 47 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ai-plan-generation-three-day-chunks' &&
      (
        github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'edited' && contains(github.event.pull_request.title, '[RUN AI PREVIEW]'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check existing external AI credentials without exposing secret values
        run: |
          set -euo pipefail
          secrets="$(npx wrangler secret list --name red-waterfall-2af8 --format json)"
          printf '%s' "$secrets" | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            const entries = JSON.parse(input);
            const configured = new Set(entries.map(item => item.name));
            const providers = {
              openai: ["OPENAI_API_KEY"],
              gemini: ["GEMINI_API_KEY", "GOOGLE_AI_API_KEY"],
              openrouter: ["OPENROUTER_API_KEY"],
              deepseek: ["DEEPSEEK_API_KEY"],
              qwen: ["DASHSCOPE_API_KEY", "QWEN_API_KEY"],
              groq: ["GROQ_API_KEY"]
            };
            const availability = Object.fromEntries(Object.entries(providers).map(([provider, names]) =>
              [provider, names.some(name => configured.has(name))]
            ));
            console.log("Existing external AI provider credentials (presence only): " + JSON.stringify(availability));
          '

      - name: Generate real 14-day and 30-day plans in isolated Cloudflare remote preview
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare API credentials are not available to this same-repository PR workflow."
            exit 1
          fi
          npx wrangler dev --remote --ip 127.0.0.1 --port 8787 --var "FITALPRO_PREVIEW_CI:1" > "$RUNNER_TEMP/fitalpro-preview.log" 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/fitalpro-preview.log"
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/fitalpro-preview.log"
            echo "Isolated Cloudflare remote preview did not become ready."
            exit 1
          fi
          if node scripts/preview-ai-plan-generation.mjs; then
            :
          else
            status=$?
            echo "Wrangler remote preview runtime log:"
            cat "$RUNNER_TEMP/fitalpro-preview.log"
            exit "$status"
          fi
