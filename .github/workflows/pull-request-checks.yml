name: Fital Pro pull request checks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fital-pro-pr-53-preview
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run syntax and regression checks
        run: npm run check

  d1-inventory:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 59 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List existing D1 databases (read-only; no resources changed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "NOT VERIFIED: Cloudflare read-only credentials are unavailable."
            exit 0
          fi
          payload="$(curl --silent --show-error --get \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" || true)"
          if [ -z "$payload" ]; then
            echo "NOT VERIFIED: Cloudflare D1 inventory request did not return a response."
            exit 0
          fi
          printf '%s' "$payload" | node --input-type=module -e '
            let input = "";
            for await (const chunk of process.stdin) input += chunk;
            let data;
            try { data = JSON.parse(input); } catch {
              console.log("NOT VERIFIED: Cloudflare returned a non-JSON response.");
              process.exit(0);
            }
            if (data.success !== true || !Array.isArray(data.result)) {
              const messages = Array.isArray(data.errors) ? data.errors.map(item => item.message).filter(Boolean).join("; ") : "";
              console.log("NOT VERIFIED: D1 list permission or API response unavailable." + (messages ? " " + messages : ""));
              process.exit(0);
            }
            console.log("READ ONLY: existing D1 databases in this account:");
            for (const db of data.result) {
              console.log((db.name || "(unnamed)") + " | " + (db.uuid || db.id || "(no id)"));
            }
            if (data.result.length === 0) console.log("No D1 databases returned.");
            console.log("No database was created, modified, or deleted.");
          '

  cloudflare-preview:
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 53 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/tilda-inspired-bold-redesign'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out PR source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Read-only audit: inspect Production settings/schema without changing Worker or D1.
      - name: Audit existing Production Worker and D1 (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloudflare-readonly-audit.mjs

      - name: Publish Cloudflare Worker Preview (non-production)
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment credentials are not configured for this repository." >&2
            exit 1
          fi
          npx wrangler preview --name fital-pro-redesign-groq-ready --message "Fital Pro PR #53 visual redesign" 2>&1 | tee "$RUNNER_TEMP/fitalpro-preview.log"
          preview_url="$(grep -Eo 'https://[a-zA-Z0-9.-]+workers\.dev' "$RUNNER_TEMP/fitalpro-preview.log" | head -n 1 || true)"
          if [ -z "$preview_url" ]; then
            echo "Wrangler completed without returning a workers.dev Preview URL." >&2
            exit 1
          fi
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "FITALPRO_PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"

      - name: Verify Preview homepage and service health
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 "$FITALPRO_PREVIEW_URL/health")"
          printf '%s' "$health" | node --input-type=module -e 'let s=""; for await (const c of process.stdin) s+=c; const d=JSON.parse(s); if (d.ok!==true || d.ai!==true) throw new Error("Preview health check failed: Worker or AI binding is missing"); if (d.db!==true) console.log("NOTICE: Preview D1 is intentionally unbound to protect Production; database and payment flows are not tested in Preview."); console.log("PASS: Preview Worker and AI are available; Preview D1 schema health:", d.db===true, "Groq secret configured:", d.groq===true)'
          page="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 "$FITALPRO_PREVIEW_URL/")"
          printf '%s' "$page" | node --input-type=module -e 'let s=""; for await (const c of process.stdin) s+=c; if (!s.includes("<html") || !s.includes("Fital")) throw new Error("Preview homepage did not load"); console.log("PASS: redesigned Fital Pro homepage is served")'
          echo "Cloudflare Preview: $FITALPRO_PREVIEW_URL"

      # Run the launch-critical 7- and 14-day AI diagnostics independently.
      # The endpoint is read-only: it does not write to D1 or create payments.
      - name: Verify the real 7-day and 14-day AI plans without database writes
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-live-ai-check')
        env:
          FITALPRO_WORKER_URL: ${{ steps.preview.outputs.url }}
          FITALPRO_AI_PLANS: Питание,PRO
        run: node scripts/live-ai-plan-validation.mjs

      # Premium is a separate, explicit opt-in because 30-day generation consumes more provider quota.
      # This read-only diagnostic validates all 30 real AI days without D1 writes or payment creation.
      - name: Verify the real 30-day Premium AI plan without database writes
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-live-premium-ai-check')
        env:
          FITALPRO_WORKER_URL: ${{ steps.preview.outputs.url }}
          FITALPRO_AI_PLANS: Premium
        run: node scripts/live-ai-plan-validation.mjs

      # Full payment/member-flow diagnostics remain separately gated and require an isolated Preview D1.
      - name: Verify Robokassa, D1 persistence, and member access for all tariffs
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-live-payment-flow')
        env:
          FITALPRO_WORKER_URL: ${{ steps.preview.outputs.url }}
        run: node scripts/live-ai-plans.mjs
