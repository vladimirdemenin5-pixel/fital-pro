name: Deploy Fital Pro to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Fital Pro

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf .fital-source
          mkdir .fital-source

          unzip -q Fital_Pro_PRODUCTION_GITHUB_READY.zip -d .fital-source

          cp -R .fital-source/. .

          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "red-waterfall-2af8",
            "main": "_worker.js",
            "compatibility_date": "2026-08-29",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": "./public",
              "binding": "ASSETS",
              "not_found_handling": "single-page-application"
            },
            "ai": {
              "binding": "AI"
            },
            "observability": {
              "enabled": true
            }
          }
          EOF

          test -f _worker.js
          test -f public/index.html
          test -d migrations

          echo "Fital Pro project prepared successfully."

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
