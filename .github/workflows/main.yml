name: Deploy Fital Pro to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fital-pro-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Deploy Fital Pro

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare project
        run: |
          set -e
          test -f _worker.js
          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css
          test -f wrangler.jsonc
          test -f migrations/0001_init.sql
          npm install
          npm run dry-run

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply fital-pro-db --remote

      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
