name: Deploy Fital Pro to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Fital Pro

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify project
        shell: bash
        run: |
          set -e

          test -f _worker.js
          test -f public/index.html
          test -f wrangler.jsonc
          test -d migrations

          echo "Fital Pro project verified successfully."

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
