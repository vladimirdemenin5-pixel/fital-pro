name: Deploy Fital Pro to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fital-pro-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: Deploy Fital Pro

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare project
        run: |
          set -e
          test -f _worker.js
          test -f public/index.html
          test -f public/app.js
          test -f public/styles.css
          test -f wrangler.jsonc
          test -f migrations/0001_init.sql
          npm install
          npm run dry-run

      - name: Deploy Worker and assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify deployed Worker health and bindings
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --max-time 20 'https://red-waterfall-2af8.vladimirdemenin5.workers.dev/health')"
          printf '%s' "$response" | node --input-type=module -e 'let s=""; for await (const c of process.stdin) s+=c; const d=JSON.parse(s); if (d.ok!==true || d.ai!==true || d.db!==true) throw new Error("Production Worker health check failed: AI or D1 binding is missing"); console.log("PASS: production Worker responds and AI/D1 bindings are attached")'
          page="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-all-errors --max-time 20 'https://red-waterfall-2af8.vladimirdemenin5.workers.dev/')"
          printf '%s' "$page" | node --input-type=module -e 'let s=""; for await (const c of process.stdin) s+=c; if (!s.includes("<html") || !s.includes("Fital")) throw new Error("Production site HTML/assets did not load"); console.log("PASS: public Fital Pro homepage is served by the deployed Worker")'
