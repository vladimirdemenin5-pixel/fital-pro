name: Validate Fital Pro

on:
  push:
    branches:
      - robokassa-safe-repair-2026-11-19
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Worker and frontend syntax
        run: npm run check

      - name: Run site-flow regression tests
        run: npm test

      - name: Validate D1 migrations locally only
        run: npm run db:migrate:local

      - name: Validate Wrangler configuration without publishing
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run

# This workflow reads the current committed source. It never unpacks release ZIPs,
# applies migrations to remote D1, or deploys the Worker.
