<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111923">
  <title>Нет соединения — Fital Pro</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body{min-height:100vh;margin:0;background:#111923;color:#fff;display:grid;place-items:center;padding:24px}
    main{max-width:440px;text-align:center}
    .offline-mark{width:66px;height:66px;object-fit:contain;margin-bottom:22px}
    h1{font-size:clamp(30px,7vw,42px);line-height:1.12;margin:0 0 14px}
    p{color:#b9c2c7;line-height:1.7;font-size:14px}
    a{display:inline-block;margin-top:18px;color:#111923;background:#c5f301;padding:13px 22px;border-radius:8px;font-weight:800}
  </style>
</head>
<body>
  <main>
    <img class="offline-mark" src="/icon.svg" alt="">
    <h1>Нет подключения к интернету</h1>
    <p>Питание, личный кабинет, ИИ-консультант и оплата требуют соединения. Подключитесь к интернету и повторите действие. Ваши данные и платежи не отправляются в автономном режиме.</p>
    <a href="/">Повторить загрузку</a>
  </main>

</html>
